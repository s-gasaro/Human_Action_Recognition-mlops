events {}

http {
  upstream api {
    # Docker DNS returns every replica of the "api" service; nginx balances across them (round robin).
    server api:8000;
  }

  server {
    listen 8000;
    client_max_body_size 50m;
    proxy_read_timeout 300s;

    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
